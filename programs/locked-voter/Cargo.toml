[package]
name = "locked-voter"
version = "0.5.8"
description = ""
edition = "2025"
homepage = "https://structalabs.com"
repository = "https://github.com/StructaLabs/structa-core"
authors = ["Structa Team <team@structalabs.com>"]
license = "AGPL-3.0"
keywords = ["solana", "anchor", "governance", "structa"]

[lib]
crate-type = ["cdylib", "lib"]
name = "locked_voter"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = ">=0.22"
anchor-spl = ">=0.22"
govern = { path = "../govern", features = ["cpi"], version = "^0.5" }
num-traits = "0.2"
vipers = "^2.0"

[dev-dependencies]
proptest = { version = "1.0" }
